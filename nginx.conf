server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Top 10 cập nhật định kỳ -> trình duyệt chỉ cache ngắn
    location = /data/top.json {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location /data/ { return 404; }   # không lộ catalog.json (~8 MB)

    # API sắp xếp (updater/server.py). Dùng biến + resolver của Docker để nginx vẫn khởi động
    # được kể cả khi container updater chưa chạy.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://updater:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        expires 1h;
    }
}
