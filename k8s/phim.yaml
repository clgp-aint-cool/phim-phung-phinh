# Sửa 3 chỗ trước khi apply:
#   1. image:  đường dẫn image trên registry của bạn (vd CMC Container Registry)
#   2. host:   domain trỏ về Ingress/LoadBalancer của cluster CMC
#   3. ingressClassName: kiểm tra bằng `kubectl get ingressclass`
apiVersion: v1
kind: Namespace
metadata:
  name: phim
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phim-web
  namespace: phim
spec:
  replicas: 2
  selector:
    matchLabels: { app: phim-web }
  template:
    metadata:
      labels: { app: phim-web }
    spec:
      # imagePullSecrets:            # bỏ comment nếu registry là private
      #   - name: registry-cred
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: REGISTRY/phim-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: phim-web
  namespace: phim
spec:
  selector: { app: phim-web }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phim-web
  namespace: phim
spec:
  ingressClassName: nginx
  rules:
    - host: phim.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phim-web
                port: { number: 80 }
  # tls:                              # bật nếu có cert-manager / secret TLS
  #   - hosts: [phim.example.com]
  #     secretName: phim-tls
